<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 32" role="img" aria-label="cascivo">
  <title>cascivo</title>
  <!-- Horizontal lockup for the Storybook manager chrome. Colours are hardcoded
       because the cascivo custom properties are not defined in the manager iframe:
       #030303 = oklch(0.1 0 0) ink, #ebdd00 = oklch(0.88 0.19 105) accent.
       Gap is 1/3 of the mark height; the mark is optically centred on the
       wordmark's x-height. The wordmark is live text — see the note in
       apps/site/public/logo.svg before reusing this as an export. -->
  <path d="M0 0H32V11H11V21H32V32H0Z" fill="#030303"/>
  <rect x="11" y="11" width="21" height="10" fill="#ebdd00"/>
  <text x="42.67" y="23.25"
        font-family="'Arial Black', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif"
        font-size="28" font-weight="900" letter-spacing="-0.05em"
        fill="#030303">cascivo</text>
</svg>
