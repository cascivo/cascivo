[package]
name = "__NAME__"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# cascivo-server and cascivo-worker are unreleased: they come from the cascivo repository.
[dependencies]
cascivo-server = { __CASCIVO_SERVER__, default-features = false, features = ["workers"] }
cascivo-web = { __CASCIVO_WEB__, default-features = false }
cascivo-worker = { __CASCIVO_WORKER__ }
axum = { version = "0.8.9", default-features = false, features = ["query"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
minijinja = { version = "3.1.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
worker = { version = "0.9.0", features = ["http", "axum"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
