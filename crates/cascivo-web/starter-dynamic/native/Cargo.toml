[package]
name = "__NAME__"
version = "0.1.0"
edition = "2024"
publish = false

# cascivo-server is unreleased: it comes from the cascivo repository.
[dependencies]
cascivo-server = { __CASCIVO_SERVER__, default-features = false, features = ["native"] }
cascivo-web = { __CASCIVO_WEB__, default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["query"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
minijinja = { version = "3.1.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "fs", "rt-multi-thread", "time"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
