name: Rust (cascivo-html)

# cascivo-html + its CLI. Generated sources (catalog, CSS, guide) are checked for drift by
# `pnpm html-kit:check` in ci.yml; this job covers the Rust side: format, lints, tests
# (parser, emitters, snapshots, determinism, CLI).
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and the rustfmt/clippy components.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # cascivo-blitz links fontconfig (Blitz system fonts); winit loads wayland/x11/xkbcommon at runtime.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      # cascivo-web's axum adapter is feature-gated; its integration test needs the feature on.
      - run: cargo test -p cascivo-web --features axum --locked
      # cascivo-blitz without its default `window` feature: the headless build embedders use.
      - run: cargo clippy -p cascivo-blitz --no-default-features --all-targets -- -D warnings
      - run: cargo test -p cascivo-blitz --no-default-features --locked
      # cascivo-server on Cloudflare Workers: wasm32, no tokio, `?Send`.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p cascivo-server --target wasm32-unknown-unknown --no-default-features --features workers --locked
