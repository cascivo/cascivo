[package]
name = "cascivo-tui"
version = "0.1.0"
edition.workspace = true
# ratatui 0.30 requires 1.88, higher than the workspace default.
rust-version = "1.88"
description = "Cascivo design system for the terminal: utility classes and components on ratatui"
license = "MIT"
repository = "https://github.com/cascivo/cascivo"
homepage = "https://github.com/cascivo/cascivo/tree/main/crates/cascivo-tui"
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "design-system", "cascivo"]
categories = ["command-line-interface"]
exclude = ["tests/"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
