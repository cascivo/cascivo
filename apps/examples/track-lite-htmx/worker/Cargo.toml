# track-lite-htmx on Cloudflare Workers: one Durable Object per visitor (cascivo.com/demos/track-lite-htmx/).
# Own workspace root: normal CI never builds it (`rust.yml` checks it for wasm32 separately).
[workspace]

[package]
name = "track-lite-htmx-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.9", default-features = false }
cascivo-server = { path = "../../../../crates/cascivo-server", default-features = false, features = [
  "workers",
] }
cascivo-worker = { path = "../../../../crates/cascivo-worker", default-features = false }
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.31"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.229", features = ["derive"] }
track-lite-htmx-server = { path = "../server", default-features = false, features = ["workers"] }
worker = { version = "0.9.0", features = ["http", "axum"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
