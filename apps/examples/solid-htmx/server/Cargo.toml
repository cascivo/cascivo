[package]
name = "solid-htmx-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "axum server for the solid-htmx example: cascivo-server, one htmx fragment route"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["query"] }
cascivo-server = { path = "../../../../crates/cascivo-server", default-features = false, features = [
  "native",
] }
cascivo-web = { path = "../../../../crates/cascivo-web", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
minijinja = { version = "3.1.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
