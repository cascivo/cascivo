<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 32" role="img" aria-label="cascivo">
  <title>cascivo</title>
  <!-- Horizontal lockup. Gap is 1/3 of the mark height (32/3); the mark is
       optically centred on the wordmark's x-height (baseline 23.25).

       The wordmark is live text, NOT outlines: 'Arial Black' substitutes on Linux
       and Android, so the advance width shifts between machines. Re-export this
       file with the wordmark converted to outlines before using it as a print or
       press asset. On the web, prefer the inline <Logo> component
       (apps/site/src/marketing/Logo.tsx), which lays the lockup out in real DOM. -->
  <path d="M0 0H32V11H11V21H32V32H0Z" fill="currentColor"/>
  <text x="42.67" y="23.25"
        font-family="'Arial Black', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif"
        font-size="28" font-weight="900" letter-spacing="-0.05em"
        fill="currentColor">cascivo</text>
</svg>
