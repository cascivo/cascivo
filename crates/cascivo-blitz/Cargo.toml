[package]
name = "cascivo-blitz"
version = "0.1.0"
edition.workspace = true
# Blitz 0.3 beta needs 1.91.
rust-version = "1.91"
description = "Render cascivo .cv text in a native Blitz window, with no browser and no Dioxus"
license = "MIT"
repository = "https://github.com/cascivo/cascivo"
homepage = "https://github.com/cascivo/cascivo/tree/main/crates/cascivo-blitz"
readme = "README.md"
keywords = ["blitz", "native", "gui", "design-system", "cascivo"]
categories = ["gui", "rendering"]
exclude = ["tests/"]

[features]
default = ["window"]
# Winit shell + Vello GPU renderer. Without it the crate is headless: build and style a document.
window = ["dep:blitz-shell", "dep:anyrender_vello"]

[dependencies]
cascivo-html = { path = "../cascivo-html", version = "0.2.0" }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "system-fonts"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
style_config = { version = "0.22", package = "stylo_static_prefs" }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, optional = true }
anyrender_vello = { version = "0.15", optional = true }

[[example]]
name = "hello"
required-features = ["window"]
