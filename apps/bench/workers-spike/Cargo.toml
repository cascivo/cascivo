# Spike X1, rebuilt on `cascivo-worker` (workstream F): docs/plans/phase-3-x1-results.md.
# Own workspace root: normal CI never builds it.
[workspace]

[package]
name = "cascivo-workers-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.9", default-features = false }
cascivo-server = { path = "../../../crates/cascivo-server", default-features = false, features = ["workers"] }
cascivo-web = { path = "../../../crates/cascivo-web", default-features = false }
cascivo-worker = { path = "../../../crates/cascivo-worker" }
console_error_panic_hook = "0.1.7"
serde_json = "1.0.154"
worker = { version = "0.9.0", features = ["http", "axum", "d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
minijinja = { version = "3.1.0", default-features = false, features = ["serde"] }
