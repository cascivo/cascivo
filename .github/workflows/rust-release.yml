name: Rust release (cascivo-html)

# Publishes cascivo-html then cascivo-html-cli to crates.io via trusted publishing (OIDC, no
# long-lived token). One-time setup is in crates/cascivo-html/README.md ("Releasing").
# Tag `cascivo-html-v<version>` after bumping both Cargo.toml versions to <version>.
on:
  push:
    tags:
      - 'cascivo-html-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates-io-auth-action exchanges the OIDC token for a short-lived publish token
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Tag matches crate versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#cascivo-html-v}"
          for c in cascivo-html cascivo-html-cli; do
            have=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$c" '.packages[] | select(.name==$c) | .version')
            [ "$have" = "$want" ] || { echo "$c is $have, tag says $want"; exit 1; }
          done
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish cascivo-html
        run: cargo publish -p cascivo-html
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # The CLI resolves cascivo-html from the registry index, which lags the upload.
      - name: Wait for the index
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="cascivo-html") | .version')
          for i in $(seq 1 30); do
            curl -fsS "https://index.crates.io/ca/sc/cascivo-html" | grep -q "\"vers\":\"$v\"" && exit 0
            sleep 10
          done
          echo "cascivo-html $v not in the index after 5 minutes"; exit 1
      - name: Publish cascivo-html-cli
        run: cargo publish -p cascivo-html-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
