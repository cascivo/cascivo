# Regenerates the landing's demo screenshots weekly.
# Triggered automatically on Sundays or manually via workflow_dispatch.
# Run locally: pnpm --filter @cascivo/site screenshots:capture

name: Regenerate demo screenshots

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Also triggerable manually from the Actions tab

# The job commits the regenerated PNGs back to the branch.
permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      # `build:landing-demos` builds the landing AND each demo app, then copies
      # every demo dist into apps/site/dist/demos/. Building only the landing
      # leaves those dists missing, which is what made the capture step fall
      # back to placeholder wireframes.
      - name: Build landing (with demo apps assembled)
        run: pnpm run build:landing-demos

      - name: Capture screenshots
        run: node scripts/gen-demo-screenshots.mjs --capture

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/site/public/screenshots/
          git diff --staged --quiet || git commit -m "chore(screenshots): regenerate demo screenshots [skip ci]"
          git push
