name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which apps changed ─────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.out.outputs.site }}
      storybook: ${{ steps.out.outputs.storybook }}
      playground: ${{ steps.out.outputs.playground }}
      live: ${{ steps.out.outputs.live }}
      track_htmx: ${{ steps.out.outputs.track_htmx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            site:
              # The unified site (cascivo.com) serves the marketing front door,
              # the docs, AND the five demos under /demos/<slug>/, so a change to
              # the app, any demo, the example kit, or shared packages redeploys it.
              - 'apps/site/**'
              - 'apps/examples/deploy/**'
              - 'apps/examples/pay/**'
              - 'apps/examples/flow/**'
              - 'apps/examples/track/**'
              - 'apps/examples/pulse/**'
              - 'apps/examples/trade/**'
              - 'apps/examples/kit/**'
              - 'scripts/assemble-demos.mjs'
              - 'packages/**'
              # Docs sources + the generators + the registry all feed the served
              # /docs, /llms, and machine-readable surfaces. Without these, a docs-only
              # or generator-only change merges without redeploying the site — the
              # staleness the 2026-07-18 report hit. A spurious deploy is free.
              - 'docs/**'
              - 'scripts/**'
              - 'registry.json'
              - 'pnpm-lock.yaml'
            storybook:
              - 'apps/storybook/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            playground:
              - 'apps/examples/json-playground/**'
              - 'packages/render/**'
              - 'packages/react/**'
              - 'pnpm-lock.yaml'
            live:
              - 'apps/live/**'
              - 'packages/app/**'
              - 'pnpm-lock.yaml'
            track_htmx:
              - 'apps/examples/track-lite-htmx/**'
              - 'crates/cascivo-server/**'
              - 'crates/cascivo-worker/**'
              - 'crates/cascivo-web/**'
      - id: out
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          SITE: ${{ steps.filter.outputs.site }}
          STORYBOOK: ${{ steps.filter.outputs.storybook }}
          PLAYGROUND: ${{ steps.filter.outputs.playground }}
          LIVE: ${{ steps.filter.outputs.live }}
          TRACK_HTMX: ${{ steps.filter.outputs.track_htmx }}
        run: |
          echo "site=$(     [ "$FORCE" = "true" ] && echo true || echo "$SITE"      )" >> $GITHUB_OUTPUT
          echo "storybook=$([ "$FORCE" = "true" ] && echo true || echo "$STORYBOOK" )" >> $GITHUB_OUTPUT
          echo "playground=$([ "$FORCE" = "true" ] && echo true || echo "$PLAYGROUND" )" >> $GITHUB_OUTPUT
          echo "live=$(      [ "$FORCE" = "true" ] && echo true || echo "$LIVE"       )" >> $GITHUB_OUTPUT
          echo "track_htmx=$([ "$FORCE" = "true" ] && echo true || echo "$TRACK_HTMX" )" >> $GITHUB_OUTPUT

  # ── Shared install + build step ───────────────────────────────────────────
  # Each app builds in its own job so failures are isolated and CF Pages
  # deployments happen in parallel.

  deploy-site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the unified site, then build + assemble the five demos into
      # apps/site/dist/demos/<slug>/ so one deploy serves the marketing front
      # door, the docs, the /examples/* pages, and every live demo.
      # The landing page's live strip renders only when this names the deployed room
      # (apps/live); unset, the page ships without it.
      - run: pnpm run build:landing-demos
        env:
          VITE_CASCIVO_LIVE_URL: ${{ vars.CASCIVO_LIVE_URL }}
      # "/" is the static cascivo-web build of apps/site/web laid over the Vite output
      # (docs/plans/rust-html-stack-results-w4.md); every other route (and the 404.html SPA
      # fallback) is unchanged. Kill switch: repo variable CASCIVO_WEB_HOME = '0' restores the
      # Preact home on the next deploy.
      # format() turns an unset variable (null) into '' so the comparison stays a string one;
      # a bare `null != '0'` coerces both to the number 0 and skipped this step.
      - if: format('{0}', vars.CASCIVO_WEB_HOME) != '0'
        run: pnpm --filter @cascivo/site build:web
      # Deploy from apps/site so Wrangler picks up apps/site/functions/ (it resolves
      # the Functions directory relative to its working directory, not the assets arg).
      # The Functions serve machine-readable 404s for /llms/*, /context/*, /r/*.
      - working-directory: apps/site
        run: >
          npx wrangler pages deploy dist
          --project-name=${{ vars.CF_PROJECT_SITE || 'cascade-ui-landing' }}
          ${{ github.event_name == 'pull_request' && format('--branch=pr-{0}', github.event.number) || '--branch=main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── Verify the production deploy actually serves the current registry version ──
  # The 2026-07-18 adopter report read docs 4 days stale from the (now retired)
  # docs.cascivo.com. cascivo.com is the single canonical host; this job fails the
  # workflow unless it serves content generated from the just-deployed registry.json,
  # and confirms docs.cascivo.com 301s to it.
  verify-site:
    needs: deploy-site
    if: needs.changes.outputs.site == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe the canonical host for freshness
        run: bash scripts/checks/deployed-freshness.sh
        env:
          FRESHNESS_RETRIES: '20' # ~5 min of CDN-propagation tolerance
          FRESHNESS_SLEEP: '15'
          # Remove this once the docs.cascivo.com → cascivo.com 301 is configured in
          # Cloudflare (docs/internal/OPS-HOSTS.md). Until then, only the canonical-host
          # freshness assertion runs; the redirect assertion is skipped.
          FRESHNESS_SKIP_REDIRECT: '1'

  deploy-storybook:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter @cascivo/storybook exec storybook build
      - run: >
          npx wrangler pages deploy apps/storybook/storybook-static
          --project-name=${{ vars.CF_PROJECT_STORYBOOK || 'cascade-ui-storybook' }}
          ${{ github.event_name == 'pull_request' && format('--branch=pr-{0}', github.event.number) || '--branch=main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-playground:
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run @cascivo/json-playground#build
      - run: >
          npx wrangler pages deploy apps/examples/json-playground/dist
          --project-name=${{ vars.CF_PROJECT_PLAYGROUND || 'cascade-ui-playground' }}
          ${{ github.event_name == 'pull_request' && format('--branch=pr-{0}', github.event.number) || '--branch=main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── The live strip's Worker (apps/live) ───────────────────────────────────
  # A public Durable Object room, so it is opt-in: nothing deploys until the repository
  # variable CASCIVO_LIVE_DEPLOY is `true`. After the first deploy, set CASCIVO_LIVE_URL to
  # its `wss://…/room` URL so the site build renders the strip (apps/live/README.md).
  deploy-live:
    needs: changes
    if: needs.changes.outputs.live == 'true' && vars.CASCIVO_LIVE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Worker imports @cascivo/app, whose exports point at dist/.
      - run: pnpm exec vp run @cascivo/app#build
      - working-directory: apps/live
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # track-lite-htmx (axum + htmx + Solid) as its own Worker on the route
  # cascivo.com/demos/track-lite-htmx/*, one Durable Object per visitor.
  deploy-track-lite-htmx:
    needs: changes
    if: needs.changes.outputs.track_htmx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Vite assets (live.js, htmx.js, elements.js, live.css) and the packages they import.
      - run: pnpm exec vp run --filter @cascivo/example-track-lite-htmx... build
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install worker-build --version 0.9.0 --locked
      # wrangler's build step runs worker-build and stages ../dist under public/.
      - working-directory: apps/examples/track-lite-htmx/worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
