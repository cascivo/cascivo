# TEMPORARY diagnostic workflow — delete before merging.
# Round 1 showed `build:release` succeeds from a plain bash step, with or without
# `--concurrency-limit 1`, and with vast resource headroom. The Release job's only
# remaining difference: the build runs INSIDE changesets/action, so its stdout is a
# pipe owned by that action's Node process. Round 2 tests exactly that.
name: TMP diag

on:
  push:
    branches: [claude/ci-failure-investigation-f46fh7]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # How @actions/exec runs a command: stdio piped, output collected by
      # listeners and forwarded. `drainMs` optionally delays the reader to model
      # a busy consumer.
      - name: Write the pipe harness
        run: |
          cat > /tmp/piped.cjs <<'EOF'
          const { spawn } = require('node:child_process')
          const drainMs = Number(process.env.DRAIN_MS ?? 0)
          const child = spawn('pnpm', ['run', 'build:release'], { stdio: ['ignore', 'pipe', 'pipe'] })
          let bytes = 0
          for (const stream of [child.stdout, child.stderr]) {
            stream.on('data', (chunk) => {
              bytes += chunk.length
              process.stdout.write(chunk)
              if (drainMs > 0) { stream.pause(); setTimeout(() => stream.resume(), drainMs) }
            })
          }
          child.on('close', (code) => {
            console.log(`\n[harness] exit=${code} bytes=${bytes} drainMs=${drainMs}`)
            process.exit(code ?? 1)
          })
          EOF

      - name: C — build:release under a Node-owned pipe (fast drain)
        id: c
        continue-on-error: true
        run: node /tmp/piped.cjs

      - name: D — same, with a slow reader (10ms per chunk)
        id: d
        continue-on-error: true
        env:
          DRAIN_MS: '10'
        run: |
          pnpm run clean
          node /tmp/piped.cjs

      - name: Verdict
        run: |
          echo "C (Node pipe, fast drain): ${{ steps.c.outcome }}"
          echo "D (Node pipe, slow drain): ${{ steps.d.outcome }}"
