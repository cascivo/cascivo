name: Rust release

# Changesets-style release flow for the Rust crates, mirroring release.yml (JS):
#   * a push to main that touches `.changeset-rust/**` with staged changesets opens/updates the
#     "Version Rust crates" PR (branch `changeset-release/rust`);
#   * merging it changes `crates/**/Cargo.toml`, which re-triggers this workflow; it then finds
#     versions that are not on crates.io and publishes them (trusted publishing, OIDC).
# A crate at version 0.0.0 is an unreleased placeholder: never published, no binaries, until its
# first changeset bumps it and the Version PR is merged.
# One-time setup is in crates/cascivo-html/README.md ("Releasing"). crates.io trusts THIS file
# name and the `crates-io` environment on the publish job — do not rename either.
on:
  push:
    branches: [main]
    paths:
      - '.changeset-rust/**'
      - 'crates/**/Cargo.toml'
  # Resume a release that failed part-way: its version bump is on main, nothing re-triggers.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

env:
  CLI: node --experimental-strip-types --no-warnings scripts/rust-release/cli.ts

jobs:
  # Opens or refreshes the Version PR. No environment: it needs no crates.io credentials.
  version:
    name: Version PR
    if: github.ref == 'refs/heads/main' # workflow_dispatch can pick any branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # push changeset-release/rust
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Detect staged changesets
        id: staged
        run: |
          count=$(find .changeset-rust -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "$count rust changeset(s) staged"
          echo "any=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Version the crates
        if: steps.staged.outputs.any == 'true'
        run: |
          $CLI status --markdown > "$RUNNER_TEMP/pr-table.md"
          $CLI version
      - name: Create or update the "Version Rust crates" PR
        if: steps.staged.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: changeset-release/rust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          git commit -m 'chore: version Rust crates'
          # The branch is derived state, rebuilt from main on every run.
          git push --force origin "$BRANCH"
          {
            echo 'Consumes the staged `.changeset-rust/` changesets. Merging publishes to crates.io.'
            echo
            cat "$RUNNER_TEMP/pr-table.md"
          } > "$RUNNER_TEMP/pr-body.md"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title 'Version Rust crates' --body-file "$RUNNER_TEMP/pr-body.md"
          fi

  # Which crate versions on main are not on crates.io? Runs even while changesets are staged:
  # a stranded release (bump merged, publish failed) is masked by the next changeset exactly as
  # in release.yml, so this must not depend on the staged count. Its own job so the no-op case
  # does not wait on the `crates-io` environment's approval.
  plan:
    name: Publish plan
    if: github.ref == 'refs/heads/main' # workflow_dispatch can pick any branch
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - id: plan
        run: |
          plan=$($CLI publish-plan)
          echo "$plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$plan" != '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates-io-auth-action exchanges the OIDC token for a short-lived publish token
    env:
      PLAN: ${{ needs.plan.outputs.plan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Dependency order, waiting for the sparse index between crates: a dependent resolves its
      # sibling from the registry index, which lags the upload. Skips versions already present,
      # so a re-run after a partial failure resumes where it stopped.
      - name: Publish each crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          while read -r item; do
            crate=$(echo "$item" | jq -r .crate)
            version=$(echo "$item" | jq -r .version)
            cargo publish -p "$crate"
            for i in $(seq 1 30); do
              if [ "$($CLI publish-plan | jq --arg c "$crate" '[.[] | select(.crate==$c)] | length')" = 0 ]; then break; fi
              [ "$i" = 30 ] && { echo "$crate $version not in the index after 5 minutes"; exit 1; }
              sleep 10
            done
          done < <(jq -c '.[]' <<< "$PLAN")

  # Tags + GitHub releases for every crate version that is on crates.io but has no release yet.
  # Its own job, derived from crates.io state rather than from what `publish` just did: if the
  # publish succeeded and the release step failed, a re-run finds nothing to publish, so a
  # release made inside `publish` would never be retried. Also backfills 0.1.0.
  releases:
    name: Tags and GitHub releases
    needs: [plan, publish]
    if: always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Create missing releases
        run: |
          set -euo pipefail
          unpublished=$($CLI publish-plan | jq -r '.[].crate')
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | "\(.name) \(.version)"' \
            | while read -r crate version; do
                if [ "$version" = 0.0.0 ]; then echo "$crate is an unreleased 0.0.0 placeholder"; continue; fi
                if grep -qx "$crate" <<< "$unpublished"; then echo "$crate $version not on crates.io yet"; continue; fi
                tag="$crate@$version"
                if gh release view "$tag" > /dev/null 2>&1; then echo "release $tag exists"; continue; fi
                $CLI changelog-section --crate "$crate" --version "$version" > "$RUNNER_TEMP/notes.md"
                gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
              done

  # Which released crates ship a binary? Derived from crates.io state (like `releases`), so a
  # re-run after a partial failure rebuilds only what is missing.
  binaries-plan:
    name: Binaries plan
    needs: releases
    if: always() && github.ref == 'refs/heads/main' && needs.releases.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - id: plan
        shell: bash
        run: |
          plan=$($CLI binaries)
          echo "$plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$plan" != '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Prebuilt binaries attached to the `<crate>@<version>` GitHub release. Matrix over targets;
  # the crates are looped inside so the plan stays one JSON value. An asset already on the
  # release is skipped, so re-running is idempotent.
  binaries:
    name: Binaries (${{ matrix.target }})
    needs: [releases, binaries-plan]
    if: always() && github.ref == 'refs/heads/main' && needs.releases.result == 'success' && needs.binaries-plan.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      PLAN: ${{ needs.binaries-plan.outputs.plan }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-bin-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build, package and upload
        shell: bash
        run: |
          set -euo pipefail
          while read -r item; do
            crate=$(jq -r .crate <<< "$item")
            version=$(jq -r .version <<< "$item")
            bin=$(jq -r .bin <<< "$item")
            tag=$(jq -r .tag <<< "$item")
            name="$bin-$version-$TARGET"
            if [[ "$TARGET" == *windows* ]]; then archive="$name.zip"; exe="$bin.exe"; else archive="$name.tar.gz"; exe="$bin"; fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$archive"; then
              echo "$archive already on $tag"
              continue
            fi
            cargo build --release --locked -p "$crate" --bin "$bin" --target "$TARGET"
            out="$RUNNER_TEMP/$name"
            rm -rf "$out" && mkdir -p "$out"
            cp "target/$TARGET/release/$exe" "$out/"
            for f in LICENSE "crates/$crate/LICENSE"; do [ -f "$f" ] && cp "$f" "$out/" && break; done || true
            if [ "$exe" != "$bin" ]; then
              (cd "$RUNNER_TEMP" && 7z a -tzip "$archive" "$name" > /dev/null)
            else
              tar -czf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "$name"
            fi
            (cd "$RUNNER_TEMP" && { sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive"; } > "$archive.sha256")
            gh release upload "$tag" "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/$archive.sha256" --clobber
          done < <(jq -c '.[]' <<< "$PLAN")
