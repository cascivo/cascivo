[package]
name = "cascivo-html-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "cascivo-html command line: render .cv to one static HTML file"

[[bin]]
name = "cascivo-html"
path = "src/main.rs"

[dependencies]
cascivo-html = { path = "../cascivo-html" }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = ["fetch"]
# `--fetch`: embed http(s) images over the network. Off: URLs stay plain references.
fetch = ["dep:ureq"]
