<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="cascivo">
  <title>cascivo</title>
  <!-- Raster source for apple-touch-icon.png (180) and the PWA icons (192, 512),
       where the accent is legible. Mark at 62.5% of the box (320 of 512), shifted
       1 grid unit (16px) right of true centre.
       Colours are hex, not oklch: ImageMagick rasterises this file (see
       scripts/gen-icons.mjs) and does not understand oklch().
       #030303 = oklch(0.1 0 0) ink; #ebdd00 = oklch(0.88 0.19 105) accent. -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <g transform="translate(112 96) scale(10)">
    <path d="M0 0H32V11H11V21H32V32H0Z" fill="#030303"/>
    <rect x="11" y="11" width="21" height="10" fill="#ebdd00"/>
  </g>
</svg>
