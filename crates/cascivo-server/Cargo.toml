[package]
name = "cascivo-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "axum layer for dynamic cascivo apps: htmx-aware views, out-of-band swaps, strict CSP with per-request nonces"
license = "MIT"
repository = "https://github.com/cascivo/cascivo"
homepage = "https://github.com/cascivo/cascivo/tree/main/crates/cascivo-server"
documentation = "https://docs.rs/cascivo-server"
readme = "README.md"
keywords = ["htmx", "axum", "server", "cascivo", "csp"]
categories = ["web-programming::http-server"]
# Unreleased until the Phase 3 "tool vs product" decision: the release tool skips it and a
# changeset cannot name it. Remove this line to release it.
publish = false
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
argon2 = { version = "0.6.0", optional = true, default-features = false, features = [
  "alloc",
  "password-hash",
] }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hmac = "0.13.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", optional = true, default-features = false, features = [
  "sqlite",
  "runtime-tokio",
] }
cascivo-html = { path = "../cascivo-html", version = "0.3.0" }
cascivo-web = { path = "../cascivo-web", version = "0.2.1", default-features = false }
getrandom = "0.4.3"
minijinja = { version = "3.1.0", default-features = false, features = ["serde"] }
form_urlencoded = "1.2.3"
# SSE stream adapters (already in the tree via axum).
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tokio = { version = "1.54.1", optional = true, features = ["net"] }
serde_html_form = "0.4.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Workers: `crypto.getRandomValues` for the CSP nonce.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# Workers: `Date.now()` for session expiry (`SystemTime::now` panics there).
js-sys = "0.3.107"

[features]
default = ["native", "password"]
# tokio + hyper: `App::serve`.
native = ["dep:tokio", "tokio/sync", "axum/tokio", "axum/http1"]
# Cloudflare Workers (wasm32, no tokio): `MaybeSend` drops its `Send` bound.
workers = []
# Datastar SSE events (`patch_elements`, `patch_signals`). Its expressions need `unsafe-eval`
# in the CSP; htmx does not.
datastar = []
# Argon2id password hashing (`hash_password`, `verify_password`).
password = ["dep:argon2"]
# `SqliteStore` (sqlx).
sqlite = ["native", "dep:sqlx"]

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["query"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
