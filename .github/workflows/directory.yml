name: Directory

on:
  pull_request:
    paths:
      - 'directory/**'

concurrency:
  group: directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `tsx` is not a dependency of this repo, so this step could never run — both
      # times the workflow fired it died on "Command tsx not found". Node 22 strips
      # types natively, which is how every other .ts script here is invoked.
      - name: Validate directory
        run: node scripts/directory/validate.ts
