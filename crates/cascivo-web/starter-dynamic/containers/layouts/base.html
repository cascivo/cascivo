<!doctype html>
<html lang="{{ site.lang }}" data-theme="{{ site.theme }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    {{ theme_script() }}
  </head>
  <body>
    <main>{% block main %}{% endblock %}</main>
    <div id="cv-toaster" aria-live="polite">{% block toaster %}{% endblock %}</div>
    {# The Worker serves /htmx.min.js from the edge (worker/public); the nonce keeps the CSP strict.
    #}
    <script nonce="{{ request.nonce }}" src="/htmx.min.js"></script>
  </body>
</html>
