name: AT sweep (screen readers)

# Nightly + manual: drives real screen readers over the 12-component AT plan and
# records what they announce. VoiceOver on macOS and NVDA on Windows are driven
# by guidepup; JAWS is licensed and not automatable on hosted runners, so it
# stays a manual spot-check (docs/specs/at-matrix.md).
#
# Each OS job writes its own stack column into at-results.json and uploads it as
# an artifact. The `publish` job then merges the columns, stamps the date, and
# opens a PR — the accessibility page renders real results instead of "pending"
# once that PR merges. Not PR-blocking; announcement grading is a first pass a
# human confirms from the logged phrases, which is what the PR is for.
#
# The merge used to be a manual step, and across ~20 green runs between
# 2026-08-03 and 2026-08-24 nobody performed it: the sweep passed nightly while
# `generatedAt` stayed null and the published page kept saying "pending". A
# verification loop whose last step depends on someone remembering is not a loop.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voiceover:
    name: VoiceOver (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages + storybook
        run: pnpm exec vp run -r build
      - name: Install AT tooling (not committed to the lockfile)
        run: |
          cd apps/storybook
          pnpm add -D @guidepup/guidepup playwright
          pnpm exec playwright install webkit
      # The guidepup CLI is a commander program — invoking the bare bin prints
      # usage and exits 1. BOTH subcommands are required: `setup` configures the
      # OS, `install` downloads the screen-reader assets into the guidepup cache
      # under $HOME. Without `install`, VoiceOver.start() dies with "Failed to
      # mount Guidepup preferences". `install` reads the manifest.json shipped by
      # @guidepup/guidepup, resolved from the working directory, so it has to run
      # where that package was added. A bare `install` picks the one screen
      # reader the manifest marks default for this platform (voiceover).
      #
      # `setup --ci` drives real macOS UI to turn on Do Not Disturb — it opens
      # Control Center over System Events and clicks a checkbox by position. That
      # loses its race often enough to have killed 3 of the 12 nightly runs to
      # 2026-08-26, always as `Failed to enable "Do not disturb" mode` (the
      # `TypeError: Error.isError is not a function` that follows is guidepup's
      # own error handler crashing on Node 22 — it hides the cause, it is not it).
      # guidepup retries the AppleScript 5x internally; a fresh process is a
      # further retry from a clean Control Center, which is all this loop is.
      - name: Enable VoiceOver automation
        working-directory: apps/storybook
        run: |
          attempt=1
          until npx --yes @guidepup/setup setup --ci; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::guidepup setup failed on all $attempt attempts"
              exit 1
            fi
            echo "guidepup setup failed (attempt $attempt) — retrying"
            attempt=$((attempt + 1))
            sleep 15
          done
          npx --yes @guidepup/setup install
      - name: Sweep
        env:
          AT_SR: voiceover
          AT_STACK_ID: voiceover-safari
        run: |
          export AT_DATE=$(date -u +%Y-%m-%d)
          node apps/storybook/scripts/at-sweep.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: at-results-voiceover
          path: apps/site/src/marketing/pages/accessibility/at-results.json

  nvda:
    name: NVDA (Windows)
    runs-on: windows-latest
    # Non-blocking: VoiceOver (macOS) is the gating AT signal; NVDA stays a
    # best-effort spot-check, like JAWS. (The msys `chmod … MapViewOfFileEx …
    # Win32 error 487` fork crash that used to kill the Windows build came from
    # `chmod +x` in @cascivo/cli's build script — that is now an fs.chmodSync
    # call, so the build no longer shells out to msys chmod.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages + storybook
        run: pnpm exec vp run -r build
      - name: Install AT tooling (not committed to the lockfile)
        run: |
          cd apps/storybook
          pnpm add -D @guidepup/guidepup playwright
          pnpm exec playwright install chromium
      # Same two-subcommand contract as the macOS job; here `install` resolves
      # to nvda.
      - name: Enable NVDA automation
        working-directory: apps/storybook
        # `shell: bash` is load-bearing: a Windows runner defaults to pwsh, which
        # parses `until … do … done` as a malformed do-loop and fails the step
        # before guidepup is ever invoked. The step was a single `npx` line until
        # the retry loop landed on 2026-08-26, which is why it only started
        # failing that night.
        shell: bash
        run: |
          attempt=1
          until npx --yes @guidepup/setup setup --ci; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::guidepup setup failed on all $attempt attempts"
              exit 1
            fi
            echo "guidepup setup failed (attempt $attempt) — retrying"
            attempt=$((attempt + 1))
            sleep 15
          done
          npx --yes @guidepup/setup install
      - name: Sweep
        env:
          AT_SR: nvda
          AT_STACK_ID: nvda-chrome
        shell: bash
        run: |
          export AT_DATE=$(date -u +%Y-%m-%d)
          node apps/storybook/scripts/at-sweep.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: at-results-nvda
          path: apps/site/src/marketing/pages/accessibility/at-results.json

  publish:
    name: Merge columns and open a PR
    needs: [voiceover, nvda]
    # `always()` so a merge still happens when NVDA fails — it is continue-on-error
    # and best-effort, and a VoiceOver-only column is a real result worth publishing.
    # at-merge.mjs refuses to stamp a date when no artifact carries results, so this
    # cannot publish "verified" over a run that produced nothing.
    if: always() && needs.voiceover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: at-artifacts
          pattern: at-results-*
      - name: Merge stack columns
        run: |
          node apps/storybook/scripts/at-merge.mjs \
            "$(date -u +%Y-%m-%d)" \
            at-artifacts/*/at-results.json
      - name: Open or update the results PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/at-results
          base: main
          title: 'chore(a11y): screen-reader sweep results'
          commit-message: 'chore(a11y): merge AT sweep results'
          body: |
            Automated from the nightly AT sweep (`.github/workflows/a11y-at.yml`).

            Grading is a first pass. Before merging, confirm the announcements
            against the phrases logged in the sweep step of each OS job — that
            judgement is the reason this is a PR and not a direct push.

            Merging publishes these on the accessibility page in place of
            "pending".
          add-paths: apps/site/src/marketing/pages/accessibility/at-results.json
          delete-branch: true
