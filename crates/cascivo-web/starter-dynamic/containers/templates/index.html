{% extends "base.html" %}
{% block main %}
<h1>{{ site.title }}</h1>
<p>Served by a container behind a Cloudflare Worker.</p>
<button hx-get="/visits" hx-target="#visits" hx-swap="innerHTML">Count a visit</button>
<p id="visits" aria-live="polite">{% block visits %}Visits: {{ visits }}{% endblock %}</p>
{% endblock %}
