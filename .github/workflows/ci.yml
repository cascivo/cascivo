name: CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format + lint (vp check)
        run: pnpm exec vp check

      - name: Host-strict lint (copied source stays clean under strict host configs)
        run: pnpm run lint:host-strict

      - name: Brand guard (no cascade→cascivo regression)
        run: pnpm run brand:check

      - name: Claims guard (hardcoded counts match reality)
        run: pnpm run claims:check

      - name: Release-filter guard (build:release covers all published packages)
        run: pnpm run release:check

      - name: Meta-coverage guard (every manifest is registered)
        run: pnpm run meta:check

      - name: i18n key-coverage guard (builtin.<ns>.<key> refs exist)
        run: pnpm run i18n:check

      - name: Docs route-indexing guard (every route has SEO head + sitemap entry)
        run: pnpm run docs-routes:check

      - name: LLMS channel + stylesheet guard (npm entries name their package + styles)
        run: pnpm run llms:check

      - name: Layer-order guard (one canonical @layer order, no drift)
        run: pnpm run layers:check

      - name: Unlayered-CSS guard (shipped CSS lives inside @layer)
        run: pnpm run unlayered:check

      - name: Reset-floor guard (no canonical @layer ships empty)
        run: pnpm run reset:check

      - name: Popover-hidden guard (a closed popover keeps no box, eats no clicks)
        run: pnpm run popover:check

      - name: Dead-props guard (a declared prop is a prop the component reads)
        run: pnpm run dead-props:check

      - name: Doc-URL guard (every shipped cascivo.com link resolves)
        run: pnpm run doc-urls:check

      - name: Primitive-adoption guard (components consume shared headless primitives)
        run: pnpm run primitives:check

      - name: APG conformance guard (declared apgPattern matches role + required keys)
        run: pnpm run apg:check

      - name: Visual-baseline coverage (every component has a committed snapshot)
        run: pnpm run visual:baselines:check

      - name: Animation audit
        run: pnpm run audit:animation

      - name: Signals subscription gate
        run: pnpm run audit:signals

      - name: Demo storage-key collision check
        run: pnpm run demos:storage:check

      - name: Standalone-install integrity (deps graph)
        run: |
          pnpm run deps:check:test
          pnpm run deps:check
          pnpm run deps:smoke

      - name: Prop-documentation coverage
        run: pnpm run docs:coverage

      - name: Story audit (orphan stories)
        run: pnpm run audit:stories

      - name: Landing link check (no broken internal routes)
        run: pnpm run links:check

      # Parallel build: vp orders by the dependency graph, so independent
      # packages build concurrently while dependents still wait for their deps.
      # The cold-cache *sequential* ordering guard lives in local `pnpm ready:ci`.
      - name: Build (vp run -r build)
        run: pnpm exec vp run -r build

      # Must run AFTER the build: the guard reads packages/react/dist and
      # skips (vacuously) when it is absent, so wiring it with the pre-build
      # *:check steps would make it silently no-op on every CI run.
      - name: SSR-import guard (published dist ships bare CSS imports)
        run: pnpm run ssr:check

      - name: CSS-contract guard (CSS-shipping packages import their own CSS + ship a node twin)
        run: pnpm run css-contract:check

      # The consumer-shaped fixture: packs the real tarballs and type-checks them in a
      # strict, non-hoisted pnpm WORKSPACE outside the repo, with skipLibCheck OFF. Every
      # other guard runs inside the monorepo, where @types/react is root-hoisted — see
      # docs/internal/feedback/README.md, Mechanism E.
      - name: Isolated-install canary (published tarballs type-check for a real consumer)
        run: pnpm run isolated:check

      - name: Install Chromium (for the computed-style canary)
        run: pnpm --filter @cascivo/site exec playwright install chromium --with-deps

      # Also AFTER the build, and for the same reason: it renders the SHIPPED dist through a
      # real browser. Two of the 2026-07-26 adopter defects (an asChild button rendering
      # underlined, a card zeroing its header's padding) were computed-style facts that jsdom
      # cannot see and a stylesheet grep cannot prove.
      - name: Computed-style canary (real browser, shipped dist)
        run: pnpm run computed:check

      # The bare-page leg: shipped styles.css and NOTHING else, full viewport, several
      # components stacked so hit-testing is meaningful. computed:check mounts one
      # component at a time in a styled 640px box, so it structurally cannot see a
      # scrollbar caused by a missing reset or an invisible overlay eating clicks.
      - name: Bare-page canary (no app CSS, stacked components, real hit-testing)
        run: pnpm run bare-page:check

      # The no-JS leg: server HTML mounted and never hydrated, so the disclosure base layer
      # is driven by the browser alone. jsdom exposes neither <summary>'s button role nor
      # Enter/Space activation nor <details name> exclusivity, so the platform behaviour
      # `clientJs: 'enhancement'` claims for Accordion/Collapsible is unprovable in the unit
      # suite and is asserted only here.
      - name: No-JS disclosure canary (static markup, real keyboard)
        run: pnpm run no-js:check

      # Executable form of the C2 report: builds a real Astro app with one client directive
      # per page and reports, per directive, whether the component CSS its markup references
      # was actually emitted. Exits 0 either way — it keeps the compatibility grade honest,
      # it does not gate on upstream Astro behaviour. See docs/USING-WITH-ASTRO.md.
      - name: Astro island CSS probe (keeps the ⚠️ Partial grade evidence-backed)
        run: pnpm --filter @cascivo/example-astro-islands run build

      - name: Bundle budgets
        run: pnpm run audit:bundle

      - name: Type check (vp run -r check)
        run: pnpm exec vp run -r check

      - name: Test (vp run -r test)
        run: pnpm run test

      - name: Doctor (component rule violations)
        run: node packages/cli/dist/index.mjs doctor --ci

  drift:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default shallow depth-1 clone) — sitemap
      # generation (scripts/sitemap/generate.ts) derives `lastmod` per URL
      # from `git log` on each source file. On a shallow clone, `git log`
      # finds no history for files untouched by the single fetched commit
      # and silently falls back to today's date, so the regenerated
      # sitemap.xml never matches the committed one and this job always
      # reports drift that isn't real.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A generator that reads the wall clock makes the drift check below (and
      # the identical gate in release.yml) fail purely because the artifacts
      # were committed on an earlier UTC day. Catch that at the source.
      - name: Regen determinism guard (no wall-clock reads in generators)
        run: pnpm run regen:check

      - name: Regenerate generated artifacts
        run: |
          pnpm run regen
          pnpm exec vp check --fix

      - name: Fail if generated artifacts drifted
        run: |
          if ! git diff --exit-code -- ':!docs/**' || [ -n "$(git status --porcelain -- ':!docs/**')" ]; then
            git status --porcelain -- ':!docs/**'
            echo '::error::Generated artifacts are stale. Run `pnpm regen && pnpm exec vp check --fix` and commit the result.'
            exit 1
          fi

      - name: Registry count check
        run: |
          COUNT=$(node -e "const r=JSON.parse(require('fs').readFileSync('registry.json','utf8')); \
            console.log((r.components?.length??0)+(r.charts?.length??0)+(r.layouts?.length??0)+(r.blocks?.length??0))")
          # Moving floor: bump on release. A guard of 49 would let a
          # mass-deletion regression to a quarter of the registry pass.
          if [ "$COUNT" -lt 185 ]; then
            echo "::error::Registry has $COUNT entries — expected >= 185"
            exit 1
          fi
          echo "Registry count: $COUNT (>= 185)"
